{% extends 'base.html' %}

{% block title %}
    <title>Admin studentlar jadvali</title>
{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:700px;">
  <h2 class="mb-4 text-center">Barcha talabalar - {{ count }}</h2>
  <table class="table table-bordered table-striped text-center">
    <thead>
      <tr>
        <th>#</th>
        <th>FIO</th>
        <th>Coin lar</th>
      </tr>
    </thead>
    <tbody>
      {% for s in students_data %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ s.student.get_full_name }}</td>
        <td>{{ s.available_points|default:0 }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
