{% extends 'base.html' %}
{% block content %}
<div class="container py-4" style="max-width:500px;">
  <h2 class="mb-4">Создать товар</h2>
  <form method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Название</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Описание</label>
      <textarea name="description" class="form-control" rows="3"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Цена (коины)</label>
      <input type="number" name="price" class="form-control" min="1" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Фото</label>
      <input type="file" name="image" class="form-control" accept="image/*" required>
    </div>
    <div class="d-flex justify-content-between">
      <a href="{% url 'motivation:admin_store' %}" class="btn btn-outline-secondary">Назад</a>
      <button type="submit" class="btn btn-success">Создать товар</button>
    </div>
  </form>
</div>
{% endblock %}
