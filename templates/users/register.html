{% extends "base.html" %}

{% block title %}Ro'yxatdan o'tish - EduTrack{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Ro'yxatdan o'tish</h4>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger" role="alert">
                        {{ error }}
                    </div>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="first_name" class="form-label">Ism</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="last_name" class="form-label">Familiya</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Elektron pochta</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Foydalanuvchi nomi</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Parol</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Parolni tasdiqlang</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                        <div class="mb-3">
                            <label for="user_type" class="form-label">Foydalanuvchi turi</label>
                            <select class="form-select" id="user_type" name="user_type" required>
                                <option value="">Tanlang</option>
                                <option value="student">Talaba</option>
                                <option value="teacher">O'qituvchi</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ro'yxatdan o'tish</button>
                    </form>
                    <div class="mt-3 text-center">
                        <p>Allaqachon hisobingiz bormi? <a href="{% url 'login' %}" class="text-decoration-none">Kirish</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
